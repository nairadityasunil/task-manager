name: Deploy to Cloudflare Pages

# Builds the production branch and uploads it to Cloudflare Pages.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID, and the repository variable VITE_API_URL
# (e.g. https://ai-todosync-backend.onrender.com/api). Optional variable
# CLOUDFLARE_PAGES_PROJECT overrides the project name.
# Without the token the deploy step is skipped, so this is safe to keep.

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && vars.VITE_API_URL != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'task-manager' }} --branch=production --commit-hash=${{ github.sha }}

      - name: Explain skipped deploy
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN or VITE_API_URL is not set, so the site was built but not deployed."
